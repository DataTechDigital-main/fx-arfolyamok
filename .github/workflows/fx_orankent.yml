name: FX-arfolyam-orankent
# EURHUF / USDHUF 15 perces, 1 órás és napi gyertyák gyűjtése a gepi/fx/ alá (forrás: Dukascopy, BID).
# Óránként fut, amíg az FX-piac nyitva van (V 22:00 UTC – P 22:00 UTC). Nyilvános repó: az Actions ingyenes.
on:
  schedule:
    - cron: "17 * * * 0-5"    # minden óra 17. percében, V–P
  push:
    branches: [main]
    paths:
      - scripts/fx_letolt.py
      - .github/workflows/fx_orankent.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fx-orankent
  cancel-in-progress: false
jobs:
  letoltes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Letöltés
        run: |
          python3 scripts/fx_letolt.py
      - name: Commit és push
        run: |
          git config user.name "fx-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gepi/fx/
          if git diff --cached --quiet; then echo "nincs új FX-adat"; exit 0; fi
          git commit -q -m "gepi/fx: EURHUF/USDHUF frissítés $(date -u '+%F %H:%M') (GitHub Actions)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*5)); done
